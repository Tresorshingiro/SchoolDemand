# School planning: PostgreSQL + PostGIS, FastAPI backend, nginx serving the dashboard.
#
#   cp deploy/.env.example deploy/.env        (then edit the passwords)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm api python -m etl.load_version2
#   -> http://localhost:8080
#
# Development: start only the database (`up -d db`) and run the API / dashboard from source (see backend/README.md).
name: school-planning

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_planning}
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"   # 5433 on the host: a local PostgreSQL may already use 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-school}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-school_planning}
      SCHOOL_DATA_DIR: /data
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ../data-sources:/data:ro   # source files for the import job (Version 2.xlsx, catchments, boundaries)
    expose:
      - "8000"

  web:
    build: ../dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
