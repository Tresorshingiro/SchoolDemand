# Dashboard (static files) under /school/ + /school/api forwarded to the FastAPI container's /api.
# The path must match the base the dashboard was built with (VITE_BASE, see vite.config.ts and the Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;  # redirects keep the browser's host and port (the container listens on 80, Docker maps 5173)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = / {
        return 302 /school/;
    }
    location = /school {
        return 302 /school/;
    }

    location /school/api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # a projection run takes a few seconds; an upload of a large file longer
        client_max_body_size 55m;     # data files uploaded in the admin portal: up to 50 MB
    }

    # Hashed build files never change: cache them for a year. index.html is always re-checked.
    location /school/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /school/index.html {
        add_header Cache-Control "no-cache";
    }
    location /school/ {
        try_files $uri $uri/ /school/index.html;
    }
}
